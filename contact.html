<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>お問い合わせ｜ダルマちゃんめだか</title>
  <meta name="description" content="ダルマちゃんめだか：お問い合わせページです。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Shippori+Mincho:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .page-shop .page-title { text-align: center; }
    .contact-form { max-width: 600px; margin: 0 auto; }
    .contact-form__field { margin-bottom: 24px; }
    .contact-form__field label { display: block; margin-bottom: 6px; font-weight: 700; }
    .contact-form__required { margin-left: 6px; padding: 1px 6px; font-size: 0.75rem; color: #fff; background: #c0392b; border-radius: var(--radius); vertical-align: middle; }
    .contact-form__note { margin: 0 0 8px; font-size: 0.9rem; line-height: 1.7; }
    .contact-form input,
    .contact-form textarea { width: 100%; padding: 10px 12px; font: inherit; color: var(--ink); background: #fff; border: 1px solid #ccc; border-radius: var(--radius); box-sizing: border-box; }
    .contact-form textarea { resize: vertical; }
    .contact-form__submit { display: block; margin: 0 auto; padding: 12px 48px; font: inherit; font-weight: 700; color: #fff; background: var(--ink); border: 0; border-radius: var(--radius); cursor: pointer; }
    .contact-form__submit:hover { opacity: 0.8; }
    .contact-form__submit:disabled { background: #999; cursor: not-allowed; opacity: 1; }
    .contact-form__notice { margin: 0 0 24px; font-weight: 700; text-align: center; }
  </style>
</head>
<body class="page-shop">
  <header class="site-header">
    <div class="site-header__inner">
      <h1 class="site-title"><a href="index.html">ダルマちゃんめだか</a></h1>
      <nav class="site-nav" aria-label="メインメニュー">
        <ul>
          <li><a href="index.html">ホーム</a></li>
          <li><a href="shop.html">ショップ</a></li>
          <li><a href="varieties.html">品種紹介</a></li>
          <li><a href="contact.html" aria-current="page">お問い合わせ</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container">
    <h2 class="page-title">お問い合わせ</h2>

    <form class="contact-form" action="send_mail.php" method="post">
      <p class="contact-form__notice">現在、お問い合わせの受付を準備中です。</p>

      <div class="contact-form__field">
        <label for="name">お名前 <span class="contact-form__required">必須</span></label>
        <input type="text" id="name" name="name" required autocomplete="name">
      </div>

      <div class="contact-form__field">
        <label for="email">メールアドレス <span class="contact-form__required">必須</span></label>
        <input type="email" id="email" name="email" required autocomplete="email">
      </div>

      <div class="contact-form__field">
        <label for="message">お問い合わせ内容 <span class="contact-form__required">必須</span></label>
        <p class="contact-form__note">お問い合わせ内容、質問等がございましたらこちらにご記入ください。<br>内容によってはお答えできない場合もございます。ご了承ください。</p>
        <textarea id="message" name="message" rows="8" required></textarea>
      </div>

      <button type="submit" class="contact-form__submit" disabled>送信する</button>
    </form>
  </main>

  <footer class="site-footer">
    <div class="site-footer__inner">
      <nav class="site-nav" aria-label="フッターメニュー">
        <ul>
          <li><a href="index.html">ホーム</a></li>
          <li><a href="shop.html">ショップ</a></li>
          <li><a href="varieties.html">品種紹介</a></li>
          <li><a href="contact.html" aria-current="page">お問い合わせ</a></li>
        </ul>
      </nav>
      <p>&copy; 2026 ダルマちゃんめだか</p>
    </div>
  </footer>
</body>
</html>
